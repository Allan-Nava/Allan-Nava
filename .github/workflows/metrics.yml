name: GitHub Metrics

on:
  schedule:
    # once a day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Generate metrics SVG
    # Renders a self-contained SVG server-side and commits it to the dedicated
    # `assets-metrics` branch (never touches master → no stale human pushes, and
    # the image can never 503 like the public github-readme-stats instance).
    #
    # Requires a CLASSIC PAT as the `METRICS_TOKEN` repo secret (see issue #16):
    # the built-in GITHUB_TOKEN is repo-scoped and cannot query the user-level
    # aggregate API this action needs. Scope: `public_repo` ONLY — the PAT just
    # reads public data, the commit to `assets-metrics` is done by
    # `committer_token`, which defaults to ${{ github.token }} (contents: write
    # is granted above). Fine-grained tokens do not cover the GraphQL v4 calls.
    # Exposed as a job-level env because `secrets` is not usable in a job `if`.
    # No secret => no-op, job stays GREEN. Previously it fell back to the stale
    # 2020 `TOKEN` secret and burned ~16 min of CI before failing every night.
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Warn if the metrics PAT is missing
        if: ${{ env.METRICS_TOKEN == '' }}
        run: |
          echo "::warning::METRICS_TOKEN secret is not set — skipping the metrics render (see issue #16)."
          echo "gh secret set METRICS_TOKEN --repo Allan-Nava/Allan-Nava   # classic PAT, scope: public_repo"

      # Embedded in the README from:
      #   https://raw.githubusercontent.com/Allan-Nava/Allan-Nava/assets-metrics/github-metrics.svg
      #
      # Two plugins are deliberately OFF — both broken upstream in metrics@3.34.0,
      # not a scope problem (the PAT resolves as `x-oauth-scopes: public_repo`):
      #   - plugin_achievements: its `AchievementsDefault` GraphQL query still asks
      #     for Projects (classic) fields, sunset by GitHub, so the request fails and
      #     the card rendered a red "Unexpected error". See the 2024-05-23 changelog.
      #   - plugin_languages: rendered an empty "Most used languages" section. The
      #     data is there (83 non-fork public repos, 77 with language data — Dart, Go,
      #     TypeScript, Rust…), the plugin just drops it. Worth retrying with
      #     `plugin_languages_indepth: yes` (slower: clones repos) on a metrics bump.
      - name: Render metrics
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: Allan-Nava
          filename: github-metrics.svg
          committer_branch: assets-metrics
          config_timezone: Europe/Rome
          base: header, activity, community, repositories, metadata
          # Palette del profilo: accento #10cf53 su #050505, testo #ffffff.
          # `config_theme` non esiste in questa action: il tema si fa solo qui.
          # I quadretti del calendario hanno `fill` hardcoded, quindi vanno presi
          # con selettori d'attributo — override su `:root` non avrebbero effetto.
          extras_css: |
            svg{background:#050505;color:#ffffff}
            h1{color:#ffffff}
            h2,h3{color:#10cf53}
            h1 svg,h2 svg,h3 svg{fill:#10cf53}
            .field{color:#ffffff}
            footer{color:#8b949e}
            .field.error{color:#ff6b6b}
            .calendar .day{outline:1px solid rgba(255,255,255,.06);outline-offset:-1px}
            .day[fill="#ebedf0"]{fill:#101a12}
            .day[fill="#9be9a8"]{fill:#0a4d24}
            .day[fill="#40c463"]{fill:#0c9440}
            .day[fill="#30a14e"]{fill:#0eb84a}
            .day[fill="#216e39"]{fill:#10cf53}
