name: Update README (latest projects)

# The one workflow that writes to README.md: it refreshes the BLOG-POST-LIST region with the
# latest projects from the site. Recent activity, streak, metrics, snake and WakaTime were
# removed on 2026-10-13 to keep the profile short for recruiters.
on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Skip when the trigger is a commit made by the bot itself, otherwise each
    # push it makes would re-trigger this workflow in a loop.
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Latest projects from allan-nava.github.io
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://allan-nava.github.io/projects/feed.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
