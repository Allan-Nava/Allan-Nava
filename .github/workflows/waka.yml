name: WakaTime Weekly Stats

on:
  schedule:
    # once a day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    name: Update the waka section in the README
    # The secret is exposed as a job-level env so the steps can be gated on it:
    # the `secrets` context is not usable in a job-level `if`, `env` is.
    # No secret => the job is a no-op and stays GREEN, instead of failing nightly.
    # Add WAKATIME_API_KEY and the next run starts filling the section on its own.
    env:
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    steps:
      - name: Warn if the WakaTime API key is missing
        if: ${{ env.WAKATIME_API_KEY == '' }}
        run: |
          echo "::warning::WAKATIME_API_KEY secret is not set — skipping the waka-readme update (see issue #15)."
          echo "gh secret set WAKATIME_API_KEY --repo Allan-Nava/Allan-Nava"
          echo "Key: https://wakatime.com/settings/account"

      # Fills the <!--START_SECTION:waka--> region in README.md.
      - name: Update waka section
        if: ${{ env.WAKATIME_API_KEY != '' }}
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ env.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: "last_7_days"
